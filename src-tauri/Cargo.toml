[package]
name = "bergag"
version = "0.1.0"
description = "Local-first desktop information and reading platform"
authors = ["Bergag contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bergag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled-full"] }
uuid = { version = "1.29.3", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
regex = "1"
feed-rs = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "charset"] }
scraper = "0.29"
ammonia = "4"
base64 = "0.22"
quick-xml = "0.42"
url = "2.5"
sha2 = "0.11"
tokio = { version = "1", features = ["net", "sync", "time", "rt"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
tauri-plugin-notification = "2.0.0"
tauri-plugin-autostart = "2.0.0"
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
tempfile = "3.27.0"
